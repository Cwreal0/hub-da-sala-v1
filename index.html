<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub da Sala</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalkboard: #24372E;
    --chalk: #F5F1E6;
    --paper: #FFFDF7;
    --paper-line: #E8DFC8;
    --ink: #2B2B26;
    --pencil: #6B6459;
    --marker: #E2542B;
    --marker-soft: #F6DCCF;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *{ box-sizing: inherit; }
  html, body{ height: 100%; margin: 0; }
  body{
    font-family: "Inter", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  header{
    background: var(--chalkboard);
    color: var(--chalk);
    padding: calc(28px + var(--safe-top)) 24px 26px;
    background-image:
      repeating-linear-gradient(rgba(245,241,230,0.035) 0px, rgba(245,241,230,0.035) 1px, transparent 1px, transparent 26px);
  }
  header h1{
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0;
  }
  header p{
    margin: 4px 0 0;
    font-size: 0.88rem;
    color: #C9CBBE;
  }

  main{
    flex: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 22px 20px calc(28px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.site-btn, span.site-btn{
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 16px;
    padding: 18px 18px;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  a.site-btn:active{ transform: scale(0.98); }
  a.site-btn:hover{ border-color: var(--marker); }

  .site-btn .icon{
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--marker-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .site-btn .icon svg{
    width: 24px; height: 24px;
    stroke: var(--marker);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .site-btn .text{ flex: 1; min-width: 0; }
  .site-btn .text h2{
    font-family: "Baloo 2", sans-serif;
    font-size: 1.05rem;
    margin: 0 0 2px;
  }
  .site-btn .text p{
    margin: 0;
    font-size: 0.82rem;
    color: var(--pencil);
  }
  .site-btn .arrow{
    flex-shrink: 0;
    width: 18px; height: 18px;
    stroke: var(--pencil);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Placeholder (site ainda não existe) */
  span.site-btn{
    cursor: default;
    opacity: 0.75;
  }
  span.site-btn:hover{ border-color: var(--paper-line); }
  span.site-btn .icon{ background: #F1EEE3; }
  span.site-btn .icon svg{ stroke: var(--pencil); }
  .badge{
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--pencil);
    background: #F1EEE3;
    padding: 3px 9px;
    border-radius: 999px;
  }

  @media (min-width: 600px){
    header{ padding-left: 40px; padding-right: 40px; }
    main{ padding-top: 32px; }
  }
</style>
</head>
<body>

<header>
  <h1>Hub da Sala</h1>
  <p>Tudo o que a turma usa, em um lugar só</p>
</header>

<main>

  <a class="site-btn" href="https://fila-do-banheiro.vercel.app">
    <span class="icon">
      <svg viewBox="0 0 24 24"><path d="M6 21V8a3 3 0 0 1 3-3h1a3 3 0 0 1 3 3v13"/><path d="M6 12h7"/><path d="M17 21v-6a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v6"/></svg>
    </span>
    <span class="text">
      <h2>Fila do banheiro</h2>
      <p>Controle de saídas da sala</p>
    </span>
    <svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <span class="site-btn">
    <span class="icon">
      <svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15 8a4 4 0 0 1 0 8"/><path d="M18 5a8 8 0 0 1 0 14"/></svg>
    </span>
    <span class="text">
      <h2>Avisos</h2>
      <p>Recados e comunicados da turma</p>
    </span>
    <span class="badge">Em breve</span>
  </span>

  <span class="site-btn">
    <span class="icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M2 20h20"/><path d="M9 20v-2h6v2"/></svg>
    </span>
    <span class="text">
      <h2>Notebooks</h2>
      <p>Controle de uso dos notebooks</p>
    </span>
    <span class="badge">Em breve</span>
  </span>

</main>

</body>
</html>
